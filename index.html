<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gali Adrian S. Nones | Portfolio</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-top: #e0e0e0;
            --bg-mid: #9c8470;
            --bg-bottom: #312b3c;
            --text-color: #1a1a1a;
            --text-light: #f4f4f4;
            --accent: #d4a373;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --transition-speed: 0.5s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-bottom);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Navigation Header */
        header {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 700px;
            background: rgba(49, 43, 60, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--text-light);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.8;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        nav ul li a:hover, nav ul li a.active {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent);
        }

        /* Hero Section */
        hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bottom) 100%);
            overflow: hidden;
            padding: 6rem 2rem 2rem 2rem;
        }

        .hero-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            background: var(--bg-mid);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Geometric background layers matching first image layout */
        .hero-bg-top-shape {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: var(--bg-top);
            clip-path: polygon(0 0, 100% 0, 100% 60%, 70% 100%, 0 70%);
            z-index: 1;
        }

        .hero-bg-bottom-shape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: var(--bg-bottom);
            clip-path: polygon(0 30%, 70% 0, 100% 30%, 100% 100%, 0 100%);
            z-index: 1;
        }

        /* Typography Content */
        .hero-content {
            position: absolute;
            left: 5rem;
            bottom: 4rem;
            z-index: 3;
            max-width: 550px;
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 4.5vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            text-transform: uppercase;
            color: var(--text-light);
            text-shadow: 2px 2px 20px rgba(0,0,0,0.4);
            letter-spacing: -1px;
        }

        .hero-content h1 span {
            display: block;
            color: var(--accent);
        }

        .hero-content p {
            margin-top: 1rem;
            font-size: 1.1rem;
            opacity: 0.85;
        }

        /* Profile Image Positioned Correctly to Match Layout Reference */
        .hero-image-wrapper {
            position: absolute;
            right: 4rem;
            bottom: 0;
            height: 90%;
            z-index: 3;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            pointer-events: none;
        }

        .hero-image-wrapper img {
            height: 105%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(-20px 20px 40px rgba(26, 23, 34, 0.6)) contrast(1.05) brightness(0.98);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 85%, rgba(0,0,0,0) 100%);
            animation: subtleFloat 6s ease-in-out infinite;
            pointer-events: auto;
        }

        @keyframes subtleFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .hero-image-wrapper img:hover {
            filter: drop-shadow(-25px 25px 50px rgba(212, 163, 115, 0.45)) contrast(1.1) brightness(1.02);
            transform: scale(1.02) translateY(-4px);
        }

        /* Responsive Mobile Navigation Shift (Bottom Dock) */
        @media (max-width: 768px) {
            header {
                top: auto;
                bottom: 1.5rem;
                width: 92%;
                max-width: 400px;
                padding: 0.7rem 1.2rem;
                background: rgba(49, 43, 60, 0.9);
                backdrop-filter: blur(16px);
            }

            .logo {
                font-size: 0.95rem;
            }

            nav ul {
                gap: 0.8rem;
            }

            nav ul li a {
                font-size: 0.85rem;
                padding: 0.3rem 0.6rem;
            }

            .hero-container {
                flex-direction: column;
                height: auto;
                min-height: 550px;
                padding: 2rem 1.5rem;
                text-align: center;
            }

            .hero-content {
                position: relative;
                left: auto;
                bottom: auto;
                margin-bottom: 1.5rem;
                max-width: 100%;
            }

            .hero-content p {
                margin: 0.8rem auto 0 auto;
            }

            .hero-image-wrapper {
                position: relative;
                right: auto;
                bottom: auto;
                height: auto;
                justify-content: center;
            }

            .hero-image-wrapper img {
                max-height: 320px;
                height: auto;
                animation: none;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <a href="#" class="logo">Gali.Dev</a>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <hero>
        <div class="hero-container">
            <!-- Background geometric layers inspired by image 1 -->
            <div class="hero-bg-top-shape"></div>
            <div class="hero-bg-bottom-shape"></div>

            <!-- Hero Text -->
            <div class="hero-content">
                <h1>Gali Adrian <span>S. Nones</span></h1>
                <p>IT Student & Frontend Developer crafting immersive UI/UX experiences and responsive web applications.</p>
            </div>

            <!-- Profile Image Positioned Correctly -->
            <div class="hero-image-wrapper">
                <img src="profile.png" alt="Gali Adrian S. Nones Profile">
            </div>
        </div>
    </hero>

</body>
</html>
